services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokemon-manager-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pokemon_manager}?schema=public
    command: sh -c "npx prisma migrate deploy && node dist/src/main/server.js"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pokemon_manager_network

  postgres:
    image: postgres:16-alpine
    container_name: pokemon-manager-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pokemon_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pokemon_manager}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pokemon_manager_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pokemon-manager-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pokemon.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
    ports:
      - '${PGADMIN_PORT:-8080}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - pokemon_manager_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  pokemon_manager_network:
    driver: bridge
